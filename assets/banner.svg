<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Shravan Kasar, AI Engineer and Founder of CaratCloud">
  <style>
    .f { font-family: 'Clash Display', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .m { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    @keyframes draw { from { stroke-dashoffset: 1700 } to { stroke-dashoffset: 0 } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .dot { animation: pulse 1.6s ease-in-out infinite; }
    .sel { stroke-dasharray: 1700; animation: draw 1.4s ease-out forwards; }
    .name { animation: rise .8s ease-out both; }
    .sub { animation: rise .8s .35s ease-out both; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#12203A" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#FAF9F6"/>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- top meta row -->
    <text x="56" y="56" class="m" font-size="13" letter-spacing="2" fill="#12203A" fill-opacity=".55">NAVI MUMBAI, INDIA · WORKING REMOTELY</text>
    <g transform="translate(822 38)">
      <rect width="324" height="28" rx="14" fill="#12203A"/>
      <circle class="dot" cx="20" cy="14" r="5" fill="#1ED760"/>
      <text x="34" y="19" class="m" font-size="12" letter-spacing="1" fill="#FFFFFF">OPEN FOR 2026 · AI &amp; FULL-STACK</text>
    </g>

    <!-- figma-style tags -->
    <g transform="translate(56 92)">
      <rect width="118" height="26" rx="6" fill="#FF5A1F"/>
      <text x="59" y="18" text-anchor="middle" class="m" font-size="12" font-weight="700" letter-spacing="1.5" fill="#fff">AI ENGINEER</text>
    </g>
    <g transform="translate(184 92)">
      <rect width="196" height="26" rx="6" fill="#2F6BFF"/>
      <text x="98" y="18" text-anchor="middle" class="m" font-size="12" font-weight="700" letter-spacing="1.5" fill="#fff">FOUNDER · CARATCLOUD</text>
    </g>

    <!-- selection frame around name -->
    <g>
      <rect class="sel" x="44" y="136" width="760" height="124" fill="none" stroke="#2F6BFF" stroke-width="2"/>
      <g fill="#fff" stroke="#2F6BFF" stroke-width="2">
        <rect x="38" y="130" width="12" height="12"/><rect x="798" y="130" width="12" height="12"/>
        <rect x="38" y="254" width="12" height="12"/><rect x="798" y="254" width="12" height="12"/>
      </g>
      <rect x="44" y="266" width="86" height="20" rx="4" fill="#2F6BFF"/>
      <text x="87" y="280" text-anchor="middle" class="m" font-size="11" fill="#fff">760 × 124</text>
    </g>

    <text x="62" y="232" class="f name" font-size="104" font-weight="800" letter-spacing="-3" fill="#12203A"><tspan fill="#FF5A1F">Shr</tspan>avan Kasar</text>

    <!-- tagline -->
    <text x="56" y="330" class="f sub" font-size="26" font-weight="600" fill="#12203A">From model training to paying customers, <tspan fill="#FF5A1F">I build AI that ships.</tspan></text>

    <!-- right column: quick facts -->
    <g transform="translate(870 136)" class="m" font-size="13" fill="#12203A">
      <rect width="276" height="150" rx="14" fill="#FFFFFF" stroke="#12203A" stroke-opacity=".12"/>
      <text x="20" y="32" font-size="11" letter-spacing="2" fill-opacity=".5">PORTRAIT.FIG</text>
      <text x="20" y="62">▸ B.Tech IT · Pillai College</text>
      <text x="20" y="88">▸ Agentic RAG · ML · ONNX</text>
      <text x="20" y="114">▸ 5 paying SaaS customers</text>
      <text x="20" y="138" fill="#FF5A1F">▸ shravankasar.vercel.app</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="22" fill="none" stroke="#12203A" stroke-opacity=".12"/>
</svg>
